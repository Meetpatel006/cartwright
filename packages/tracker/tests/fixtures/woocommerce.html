<!DOCTYPE html>
<html>
<head>
  <title>WooCommerce Storefront Sample</title>
</head>
<body class="woocommerce single-product">
  <div class="cart-contents"><span class="count">3</span></div>
  <div class="product">
    <h1 class="product_title entry-title">Organic Cotton Hoodie</h1>
    <p class="price"><span class="woocommerce-Price-amount amount"><span class="woocommerce-Price-currencySymbol">$</span>45.00</span></p>
    <div class="woocommerce-product-details__short-description">Comfortable eco-friendly hoodie.</div>
    <form class="cart" action="/product/hoodie" method="post" enctype="multipart/form-data">
      <span class="sku_wrapper">SKU: <span class="sku">HOODIE-01</span></span>
      <button type="submit" name="add-to-cart" value="123" class="single_add_to_cart_button button alt">Add to cart</button>
    </form>
  </div>
</body>
</html>
