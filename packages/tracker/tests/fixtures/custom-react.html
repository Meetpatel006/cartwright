<!DOCTYPE html>
<html>
<head>
  <title>Custom Next.js React Storefront</title>
  <meta property="og:type" content="product">
  <meta property="og:title" content="Wireless Noise-Cancelling Headphones">
  <meta property="product:price:amount" content="199.99">
  <meta property="product:price:currency" content="USD">
  <meta property="product:brand" content="SonicSound">
</head>
<body>
  <div id="__next" data-reactroot="">
    <div class="cart-drawer">
      <span class="cart-count">1</span>
    </div>
    <main>
      <h1>Wireless Noise-Cancelling Headphones</h1>
      <div class="current-price">$199.99</div>
      <button class="add-to-cart-btn" data-cartwright-product-id="HEADPHONES-NC-9" data-cartwright-event="add_to_cart">
        Add to Cart
      </button>
    </main>
  </div>
</body>
</html>
