<!DOCTYPE html>
<html>
<head>
  <title>Unknown Boutique Store</title>
</head>
<body>
  <!-- Pure custom HTML with explicit Cartwright fallback markup -->
  <div class="custom-wrapper">
    <div
      data-cartwright-product-id="PROD_RUNNER_77"
      data-cartwright-product-name="Ultralight Carbon Running Shoes"
      data-cartwright-product-price="189.00"
      data-cartwright-product-currency="USD">
      <h2>Ultralight Carbon Running Shoes</h2>
      <span>Price: $189.00</span>
    </div>

    <button
      data-cartwright-event="add_to_cart"
      data-cartwright-product-id="PROD_RUNNER_77"
      data-cartwright-product-name="Ultralight Carbon Running Shoes">
      Purchase Item
    </button>
  </div>
</body>
</html>
