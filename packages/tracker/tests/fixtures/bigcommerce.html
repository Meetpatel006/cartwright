<!DOCTYPE html>
<html>
<head>
  <title>BigCommerce Storefront Sample</title>
  <link rel="stylesheet" href="https://cdn11.bigcommerce.com/style.css">
</head>
<body data-page-type="product">
  <div class="cart-quantity countPill">5</div>
  <div class="productView" data-stencil-product>
    <h1 class="productView-title">Trailblazer Mountain Bike</h1>
    <div class="productView-price">
      <div class="price-section price-section--withoutTax">
        <span class="price price--withoutTax">$799.00</span>
      </div>
    </div>
    <div class="productView-info-value--sku" data-product-sku="BIKE-MTN-700">BIKE-MTN-700</div>
    <form method="post" action="/cart.php" enctype="multipart/form-data" data-cart-item-add>
      <input id="form-action-addToCart" data-wait-message="Adding to cart…" class="button button--primary" type="submit" value="Add to Cart">
    </form>
  </div>
</body>
</html>
