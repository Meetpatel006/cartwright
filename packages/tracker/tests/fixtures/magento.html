<!DOCTYPE html>
<html>
<head>
  <title>Magento Adobe Commerce Storefront Sample</title>
</head>
<body class="catalog-product-view page-layout-1column">
  <div class="minicart-wrapper">
    <span class="counter-number">1</span>
  </div>
  <div class="product-info-main">
    <div class="page-title-wrapper product">
      <h1 class="page-title"><span class="base">Pro Chronograph Watch</span></h1>
    </div>
    <div class="product-info-price">
      <div class="price-box" data-role="priceBox">
        <span class="price" data-price-type="finalPrice">$299.00</span>
      </div>
    </div>
    <div class="product attribute sku">
      <strong class="type">SKU</strong>
      <div class="value" itemprop="sku">WATCH-990</div>
    </div>
    <form action="/checkout/cart/add" method="post" id="product_addtocart_form">
      <button type="submit" title="Add to Cart" class="action primary tocart" id="product-addtocart-button">
        <span>Add to Cart</span>
      </button>
    </form>
  </div>
</body>
</html>
